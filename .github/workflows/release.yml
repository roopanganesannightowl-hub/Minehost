name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, sign and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are configured
        # Fail immediately with an actionable message instead of dying deep in
        # Gradle with an obscure keystore error.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD,"
            echo "::error::KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables"
            echo "::error::> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew testStandardDebugUnitTest

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          test -s keystore/release.keystore

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APKs
        # Two flavors: standard (modern target SDK) and local (legacy target
        # SDK 28, which may execute the on-demand Android Java runtime).
        run: ./gradlew assembleStandardRelease assembleLocalRelease

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/standard/release/app-standard-release.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/local/release/app-local-release.apk

      - name: Name the APKs after the release
        run: |
          NAME="MineHost-${GITHUB_REF_NAME:-dev}.apk"
          LOCAL_NAME="MineHost-${GITHUB_REF_NAME:-dev}-local.apk"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "$NAME"
          cp app/build/outputs/apk/local/release/app-local-release.apk "$LOCAL_NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_LOCAL_NAME=$LOCAL_NAME" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        # Idempotent so a re-run of an already published tag replaces the APK
        # instead of failing with "release already exists".
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" "$APK_LOCAL_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$APK_LOCAL_NAME" \
              --title "MineHost $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minehost-signed-apk
          path: MineHost-*.apk
